<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#6c3ce1"><title>🧸 مساعدي الذكي للأطفال</title><link rel="manifest" href="./manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="عالم الأطفال"><style>
:root{--bg:#0d0b2a;--card:#1e1c42;--p:#6c3ce1;--pink:#e8368f;--teal:#00bfa5;--text:#fff;--muted:#b9b5d1}*{box-sizing:border-box}html{height:100%;background:#0d0b2a}body{margin:0;background:radial-gradient(circle at top,#21164d,#0d0b2a 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%;min-height:100svh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:100%;max-width:760px;margin:auto;min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}.top{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font-weight:900;font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.setup{padding:clamp(16px,4vw,24px);padding-bottom:max(18px,env(safe-area-inset-bottom));overflow:auto}.hero{text-align:center;padding:clamp(14px,4vh,28px) 0 10px}.hero .emoji{font-size:62px}.hero h1{margin:8px 0 4px;font-size:28px;color:#ffd95c}.hero p{color:var(--muted);margin:0}.ages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px 0}.age{border:1px solid #ffffff18;background:var(--card);color:#fff;border-radius:14px;padding:12px 4px}.age.active{background:var(--p);border-color:#bca8ff}.age b{display:block;font-size:18px}.age span{font-size:10px;color:#ddd}.chat{display:none;flex:1;min-height:0;min-height:100svh;min-height:100dvh;flex-direction:column}.messages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 14px 10px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}.msg{max-width:86%;padding:12px 15px;border-radius:18px;margin-bottom:10px;line-height:1.8;white-space:pre-wrap}.bot{background:var(--card);border-top-right-radius:5px}.user{background:var(--p);margin-right:auto;border-top-left-radius:5px}.chips{display:flex;gap:7px;overflow:auto;padding:0 14px 8px}.chip{white-space:nowrap;border:0;background:#ffffff12;color:#ddd;border-radius:20px;padding:8px 12px;font-size:12px}.composer{flex-shrink:0;padding:10px 12px max(14px,env(safe-area-inset-bottom));background:#0d0b2af5;border-top:1px solid #ffffff12;backdrop-filter:blur(10px)}.row{display:flex;gap:8px;align-items:flex-end}.input{flex:1;background:var(--card);border:1px solid #ffffff18;color:#fff;border-radius:18px;padding:12px 14px;resize:none;min-height:48px;max-height:120px;outline:none}.iconbtn{width:50px;height:50px;border:0;border-radius:16px;background:var(--teal);font-size:22px}.mic{background:var(--pink)}.mic.recording{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 8px #e8368f22}}.status{text-align:center;color:var(--muted);font-size:10px;min-height:18px}.primary{width:100%;border:0;background:var(--p);color:#fff;border-radius:16px;padding:14px;font-weight:800}.floating{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(88px,calc(72px + env(safe-area-inset-bottom)));width:58px;height:58px;border-radius:50%;border:0;background:var(--p);box-shadow:0 8px 30px #0008;font-size:28px;display:none}<style>
@media (max-width:600px){
  .app{max-width:none}
  .top{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
  .brand{font-size:16px}
  .hero .emoji{font-size:52px}
  .hero h1{font-size:24px}
  .hero p{font-size:13px}
  .ages{gap:6px;margin:14px 0}
  .age{padding:10px 2px;border-radius:12px}
  .age b{font-size:15px}
  .age span{font-size:9px}
  .primary{padding:13px}
  .messages{padding-left:12px;padding-right:12px}
  .msg{max-width:92%;font-size:14px;line-height:1.7}
  .chips{padding-left:10px;padding-right:10px}
  .composer{padding-left:10px;padding-right:10px}
  .input{min-height:46px;max-height:110px;padding:11px 12px}
  .iconbtn{width:46px;height:46px;border-radius:14px}
}
@media (max-height:700px){
  .hero{padding-top:8px}
  .hero .emoji{font-size:42px}
  .hero h1{font-size:21px}
  .ages{margin:10px 0}
}
</style></style></head>
<body><div class="app"><header class="top"><div class="brand">🧸 مساعدي الذكي<small>مساعد تعليمي آمن للأطفال</small></div><button id="install" style="display:none;border:0;border-radius:12px;background:#00bfa5;color:#fff;padding:9px 12px;font-weight:800;font-size:12px">📲 تثبيت التطبيق</button></header>
<section class="setup" id="setup"><div class="hero"><div class="emoji">🧸</div><h1>اسألني أي شيء!</h1><p>اختر عمرك لأعطيك شرحًا مناسبًا لك</p></div><div class="ages" id="ages"></div><button class="primary" id="start">ابدأ 🚀</button><p style="font-size:11px;color:#aaa;line-height:1.7">لأفضل تجربة على الجوال أو التابلت استخدم Chrome أو Edge واسمح للمايكروفون عند الطلب.</p></section>
<section class="chat" id="chat"><div class="messages" id="messages"></div><div class="chips"><button class="chip">ليش السماء زرقاء؟ 🌈</button><button class="chip">ساعدني في الواجب 📚</button><button class="chip">قل لي معلومة 🤓</button></div><div class="composer"><div class="status" id="status"></div><div class="row"><button class="iconbtn mic" id="mic">🎤</button><textarea class="input" id="input" rows="1" placeholder="اكتب سؤالك هنا..."></textarea><button class="iconbtn" id="send">➤</button></div></div></section></div>
<button class="floating" id="float">🧸</button><script>
const API_BASE_URL="https://kids-ai-gateway.impxsmarttv.workers.dev";
let deferredInstallPrompt=null;
const installBtn=document.getElementById("install");
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(installBtn)installBtn.style.display="block";
});
if(installBtn)installBtn.onclick=async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  installBtn.style.display="none";
};
window.addEventListener("appinstalled",()=>{
  if(installBtn)installBtn.style.display="none";
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}const $=id=>document.getElementById(id);const ages=[["2–4","صغير"],["5–7","مبتدئ"],["8–10","مستكشف"],["11–13","متقدم"],["14–16","يافع"]];let age=9,recognition=null,recording=false;
ages.forEach((a,i)=>{const b=document.createElement("button");b.className="age";b.innerHTML="<b>"+a[0]+"</b><span>"+a[1]+"</span>";b.onclick=()=>{age=[3,6,9,12,15][i];document.querySelectorAll(".age").forEach(x=>x.classList.remove("active"));b.classList.add("active")};$("ages").appendChild(b)});document.querySelectorAll(".age")[2].classList.add("active");
function add(text,who="bot"){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("messages").appendChild(d);requestAnimationFrame(()=>{$("messages").scrollTop=$("messages").scrollHeight})}
function speak(text){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ar-SA";u.rate=age<=7?.9:1;speechSynthesis.speak(u)}
async function ask(q){if(!q.trim())return;add(q,"user");$("input").value="";$("status").textContent="يفكر... 🧠";try{const r=await fetch(API_BASE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({age:age,message:q})});if(!r.ok)throw new Error("API");const j=await r.json();const a=j.answer||"لم أفهم السؤال، حاول مرة أخرى 😊";add(a);speak(a)}catch(e){add("حدثت مشكلة في الاتصال بالمساعد. حاول مرة أخرى بعد قليل 😊")}finally{$("status").textContent=""}}
$("start").onclick=()=>{$("setup").style.display="none";$("chat").style.display="flex";$("float").style.display="block";add("مرحبًا! 🧸 عمرك "+age+" سنوات، وسأشرح لك بطريقة تناسبك. اسألني أو اضغط 🎤 وتحدث!")};
$("send").onclick=()=>ask($("input").value);$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask($("input").value)}});document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>ask(c.textContent));
$("float").onclick=()=>{$("setup").style.display="none";$("chat").style.display="flex"};
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("المتصفح لا يدعم التعرف الصوتي. جرّب Chrome على Android.");return}if(recording){recognition.stop();return}recognition=new SR();recognition.lang="ar-SA";recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{recording=true;$("mic").classList.add("recording");$("status").textContent="أسمعك... تحدث الآن 🎙️"};recognition.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$("input").value=t;if(e.results[e.results.length-1].isFinal)ask(t)};recognition.onerror=()=>{$("status").textContent="تعذر استخدام المايكروفون"};recognition.onend=()=>{recording=false;$("mic").classList.remove("recording");setTimeout(()=>{$("status").textContent=""},500)};recognition.start()};
</script></body></html>
