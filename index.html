<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#6c3ce1"><title>🧸 مساعدي الذكي للأطفال</title><style>
:root{--bg:#0d0b2a;--card:#1e1c42;--p:#6c3ce1;--pink:#e8368f;--teal:#00bfa5;--text:#fff;--muted:#b9b5d1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#21164d,#0d0b2a 60%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column}.top{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font-weight:900;font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.setup{padding:18px}.hero{text-align:center;padding:18px 0}.hero .emoji{font-size:62px}.hero h1{margin:8px 0 4px;font-size:28px;color:#ffd95c}.hero p{color:var(--muted);margin:0}.ages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.age{border:1px solid #ffffff18;background:var(--card);color:#fff;border-radius:14px;padding:12px 4px}.age.active{background:var(--p);border-color:#bca8ff}.age b{display:block;font-size:18px}.age span{font-size:10px;color:#ddd}.chat{display:none;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px}.msg{max-width:86%;padding:12px 15px;border-radius:18px;margin-bottom:10px;line-height:1.8;white-space:pre-wrap}.bot{background:var(--card);border-top-right-radius:5px}.user{background:var(--p);margin-right:auto;border-top-left-radius:5px}.chips{display:flex;gap:7px;overflow:auto;padding:0 14px 8px}.chip{white-space:nowrap;border:0;background:#ffffff12;color:#ddd;border-radius:20px;padding:8px 12px;font-size:12px}.composer{padding:10px 12px 14px;background:#0d0b2add;border-top:1px solid #ffffff12}.row{display:flex;gap:8px;align-items:flex-end}.input{flex:1;background:var(--card);border:1px solid #ffffff18;color:#fff;border-radius:18px;padding:12px 14px;resize:none;min-height:48px;max-height:120px;outline:none}.iconbtn{width:50px;height:50px;border:0;border-radius:16px;background:var(--teal);font-size:22px}.mic{background:var(--pink)}.mic.recording{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 8px #e8368f22}}.status{text-align:center;color:var(--muted);font-size:10px;min-height:18px}.primary{width:100%;border:0;background:var(--p);color:#fff;border-radius:16px;padding:14px;font-weight:800}.floating{position:fixed;right:16px;bottom:92px;width:58px;height:58px;border-radius:50%;border:0;background:var(--p);box-shadow:0 8px 30px #0008;font-size:28px;display:none}</style></head>
<body><div class="app"><header class="top"><div class="brand">🧸 مساعدي الذكي<small>مساعد تعليمي آمن للأطفال</small></div></header>
<section class="setup" id="setup"><div class="hero"><div class="emoji">🧸</div><h1>اسألني أي شيء!</h1><p>اختر عمرك لأعطيك شرحًا مناسبًا لك</p></div><div class="ages" id="ages"></div><button class="primary" id="start">ابدأ 🚀</button><p style="font-size:11px;color:#aaa;line-height:1.7">لأفضل تجربة على الجوال أو التابلت استخدم Chrome أو Edge واسمح للمايكروفون عند الطلب.</p></section>
<section class="chat" id="chat"><div class="messages" id="messages"></div><div class="chips"><button class="chip">ليش السماء زرقاء؟ 🌈</button><button class="chip">ساعدني في الواجب 📚</button><button class="chip">قل لي معلومة 🤓</button></div><div class="composer"><div class="status" id="status"></div><div class="row"><button class="iconbtn mic" id="mic">🎤</button><textarea class="input" id="input" rows="1" placeholder="اكتب سؤالك هنا..."></textarea><button class="iconbtn" id="send">➤</button></div></div></section></div>
<button class="floating" id="float">🧸</button><script>
const API_BASE_URL="https://kids-ai-gateway.impxsmarttv.workers.dev";const $=id=>document.getElementById(id);const ages=[["2–4","صغير"],["5–7","مبتدئ"],["8–10","مستكشف"],["11–13","متقدم"],["14–16","يافع"]];let age=9,recognition=null,recording=false;
ages.forEach((a,i)=>{const b=document.createElement("button");b.className="age";b.innerHTML="<b>"+a[0]+"</b><span>"+a[1]+"</span>";b.onclick=()=>{age=[3,6,9,12,15][i];document.querySelectorAll(".age").forEach(x=>x.classList.remove("active"));b.classList.add("active")};$("ages").appendChild(b)});document.querySelectorAll(".age")[2].classList.add("active");
function add(text,who="bot"){const d=document.createElement("div");d.className="msg "+who;d.textContent=text;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight}
function speak(text){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ar-SA";u.rate=age<=7?.9:1;speechSynthesis.speak(u)}
async function ask(q){if(!q.trim())return;add(q,"user");$("input").value="";$("status").textContent="يفكر... 🧠";try{const r=await fetch(API_BASE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({age:age,message:q})});if(!r.ok)throw new Error("API");const j=await r.json();const a=j.answer||"لم أفهم السؤال، حاول مرة أخرى 😊";add(a);speak(a)}catch(e){add("حدثت مشكلة في الاتصال بالمساعد. حاول مرة أخرى بعد قليل 😊")}finally{$("status").textContent=""}}
$("start").onclick=()=>{$("setup").style.display="none";$("chat").style.display="flex";$("float").style.display="block";add("مرحبًا! 🧸 عمرك "+age+" سنوات، وسأشرح لك بطريقة تناسبك. اسألني أو اضغط 🎤 وتحدث!")};
$("send").onclick=()=>ask($("input").value);$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask($("input").value)}});document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>ask(c.textContent));
$("float").onclick=()=>{$("setup").style.display="none";$("chat").style.display="flex"};
$("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("المتصفح لا يدعم التعرف الصوتي. جرّب Chrome على Android.");return}if(recording){recognition.stop();return}recognition=new SR();recognition.lang="ar-SA";recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{recording=true;$("mic").classList.add("recording");$("status").textContent="أسمعك... تحدث الآن 🎙️"};recognition.onresult=e=>{let t="";for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;$("input").value=t;if(e.results[e.results.length-1].isFinal)ask(t)};recognition.onerror=()=>{$("status").textContent="تعذر استخدام المايكروفون"};recognition.onend=()=>{recording=false;$("mic").classList.remove("recording");setTimeout(()=>{$("status").textContent=""},500)};recognition.start()};
</script></body></html>
